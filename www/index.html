const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 540; let H = 960, VS = 1, DPR = 1;
function resize() {
  const iw = innerWidth, ih = innerHeight;
  H = Math.round(Math.min(1170, Math.max(800, W * ih / iw)));
  VS = Math.min(iw / W, ih / H);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = (W * VS) + 'px'; cv.style.height = (H * VS) + 'px';
  cv.width = Math.round(W * VS * DPR); cv.height = Math.round(H * VS * DPR);
}
addEventListener('resize', resize); resize();

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
const FONT = 'system-ui, Roboto, "Segoe UI", sans-serif';

/* ---------------- Sprite helpers ---------------- */
const SS = 2;
function sprite(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w * SS); c.height = Math.ceil(h * SS);
  const g = c.getContext('2d'); g.scale(SS, SS); fn(g, w, h);
  c.w = w; c.h = h; return c;
}
function tint(src, color) {
  const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const g = c.getContext('2d'); g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  c.w = src.w; c.h = src.h; return c;
}
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function poly(g, p) { g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); }
function lg(g, x0, y0, x1, y1, stops) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c)); return gr;
}
function radial(g, x, y, r, stops) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr;
}
function glowDot(r, color) {
  return sprite(r * 2, r * 2, g => {
    g.fillStyle = radial(g, r, r, r, [[0, '#fff'], [0.22, color], [1, 'rgba(0,0,0,0)']]);
    g.fillRect(0, 0, r * 2, r * 2);
  });
}
function drawSpr(s, x, y, rot = 0, sc = 1) {
  const w = s.w * sc, h = s.h * sc;
  if (rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.drawImage(s, -w / 2, -h / 2, w, h); ctx.restore(); }
  else ctx.drawImage(s, x - w / 2, y - h / 2, w, h);
}

/* ---------------- Background (ciudad neón procedural) ---------------- */
const CH = 640, BG_SS = 2;
const ROADV = [[112, 48], [380, 48]];
function lightDot(g, x, y, c, r = 6) {
  g.fillStyle = radial(g, x, y, r, [[0, '#fff'], [0.3, c], [1, 'rgba(0,0,0,0)']]); g.fillRect(x - r, y - r, r * 2, r * 2);
}
function building(g, x, y, w, h) {
  if (w < 14 || h < 14) return;
  const tops = pick([['#1b2440', '#111728'], ['#222c44', '#141a2b'], ['#261d3a', '#16112a'], ['#172a31', '#0d181c']]);
  g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(x + 5, y + 5, w, h);
  g.fillStyle = lg(g, x, y, x + w, y + h, tops); g.fillRect(x, y, w, h);
  g.fillStyle = 'rgba(255,255,255,0.06)'; g.fillRect(x, y, w, 2); g.fillRect(x, y, 2, h);
  const n = pick(NEON), r = Math.random();
  if (r < 0.2 && w > 46 && h > 46) {
    const cx = x + w / 2, cy = y + h / 2, rad = Math.min(w, h) * 0.32;
    g.globalAlpha = 0.75; g.strokeStyle = n; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, rad, 0, TAU); g.stroke();
    g.fillStyle = n; g.font = `800 ${Math.round(rad)}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('H', cx, cy + 1);
    g.globalAlpha = 1;
    for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) lightDot(g, cx + dx * rad * 1.15, cy + dy * rad * 1.15, n, 4);
  } else if (r < 0.45) {
    const s = 12; for (let yy = y + 8; yy + s < y + h - 6; yy += s + 6) for (let xx = x + 8; xx + s < x + w - 6; xx += s + 6) {
      if (Math.random() < 0.3) continue;
      g.fillStyle = '#2c3552'; g.fillRect(xx, yy, s, s); g.fillStyle = '#121729'; g.beginPath(); g.arc(xx + s / 2, yy + s / 2, s * 0.32, 0, TAU); g.fill();
    }
  } else if (r < 0.65) {
    for (let yy = y + 7; yy + 8 < y + h - 5; yy += 11) {
      g.fillStyle = '#12305a'; g.fillRect(x + 7, yy, w - 14, 8);
      g.fillStyle = 'rgba(120,200,255,0.25)'; g.fillRect(x + 7, yy, w - 14, 1);
    }
  } else if (r < 0.82 && w > 30 && h > 30) {
    g.fillStyle = lg(g, x, y, x + w, y + h, [n + '55', n + '10']); g.fillRect(x + 8, y + 8, w - 16, h - 16);
    g.strokeStyle = n; g.globalAlpha = 0.8; g.lineWidth = 1.5; g.strokeRect(x + 8.5, y + 8.5, w - 17, h - 17); g.globalAlpha = 1;
  } else {
    for (let xx = x + 6; xx + 5 < x + w - 4; xx += 9) { g.fillStyle = Math.random() < 0.15 ? 'rgba(255,220,140,0.35)' : '#1b3150'; g.fillRect(xx, y + 6, 5, h - 12); }
  }
  if (Math.random() < 0.55) { g.globalAlpha = 0.5; g.strokeStyle = n; g.lineWidth = 1.2; g.strokeRect(x + 3.5, y + 3.5, w - 7, h - 7); g.globalAlpha = 1; }
  for (let k = ri(0, 2); k > 0; k--) lightDot(g, x + rand(5, w - 5), y + rand(5, h - 5), pick(['#ff3355', '#00e5ff', '#ffffff']));
}
function park(g, x, y, w, h) {
  g.fillStyle = '#0a1a19'; g.fillRect(x, y, w, h);
  g.strokeStyle = 'rgba(57,255,136,0.35)'; g.lineWidth = 1; g.strokeRect(x + 2.5, y + 2.5, w - 5, h - 5);
  for (let i = 0; i < w * h / 500; i++) {
    const tx = rand(x + 8, x + w - 8), ty = rand(y + 8, y + h - 8), tr = rand(5, 10);
    g.fillStyle = radial(g, tx, ty, tr, [[0, '#3fdc8a'], [0.5, '#17694a'], [1, 'rgba(10,40,30,0)']]);
    g.beginPath(); g.arc(tx, ty, tr, 0, TAU); g.fill();
  }

function update(dt) {

    const ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    P.x += kx * 430 * dt; P.y += ky * 430 * dt;
    P.x = clamp(P.x, 26, W - 26); P.y = clamp(P.y, 70, H - 50);
    const vx = (P.x - P.px) / Math.max(dt, 0.001); P.px = P.x;

    P.inv = Math.max(0, P.inv - dt);
    P.fireT -= dt; if (P.fireT <= 0) { P.fireT = 0.1; firePlayer(); }

    P.deadT += dt;

  if (G.state === 'over') overT += dt;
  if (G.state === 'play') spawner(dt);

  for (const b of pB) {
    if (b.missile) {

    }
    b.x += b.vx * dt; b.y += b.vy * dt;

  for (const e of EN) updateEnemy(e, dt);
  if (boss) updateBoss(dt);

  collisions();
  pB = pB.filter(b => !b.dead && b.y > -50 && b.y < H + 50 && b.x > -50 && b.x < W + 50);
  eB = eB.filter(b => !b.dead && b.x > -30 && b.x < W + 30 && b.y > -30 && b.y < H + 30);
  EN = EN.filter(e => !e.dead);
  for (const u of PU) {
    u.tt += dt; u.y += 75 * dt; u.x += Math.sin(u.tt * 3) * 30 * dt;
    if (P.alive) { const dx = P.x - u.x, dy = P.y - u.y, d = Math.hypot(dx, dy); if (d < 120) { u.x += dx / d * 420 * dt; u.y += dy / d * 420 * dt; } }

  for (const p of PA) { p.life -= dt; p.vx *= damp; p.vy *= damp; p.x += p.vx * dt; p.y += (p.vy + bgSpeed * 0.6) * dt; }

}
function collisions() {
  for (const b of pB) {
    if (b.dead) continue;
    for (const e of EN) {
      if (e.dead || e.delay > 0) continue;
      const rr = e.r + b.r, dx = e.x - b.x, dy = e.y - b.y;
      if (dx * dx + dy * dy < rr * rr) { b.dead = true; hitEnemy(e, b.dmg, b.x, b.y); break; }
    }
    if (!b.dead && boss && !boss.dying && boss.y > -20) {
      for (const [ox, oy, r] of BH) {
        const dx = boss.x + ox - b.x, dy = boss.y + oy - b.y, rr = r + b.r;
        if (dx * dx + dy * dy < rr * rr) { b.dead = true; damageBoss(b.dmg, b.x, b.y); break; }
      }
    }
  }
  if (!P.alive) return;
  if (P.inv <= 0) {
    for (const b of eB) {
      const dx = b.x - P.x, dy = b.y - P.y, rr = b.r + P.r;
      if (dx * dx + dy * dy < rr * rr) { b.dead = true; hurtPlayer(); break; }
    }
    for (const e of EN) {
      if (e.dead || e.delay > 0) continue;
      const dx = e.x - P.x, dy = e.y - P.y, rr = e.r * 0.75 + 14;
      if (dx * dx + dy * dy < rr * rr) { hitEnemy(e, 10, e.x, e.y); hurtPlayer(); break; }

    }

    if (dx * dx + dy * dy < 34 * 34) {
      u.dead = true; SFX.power(); burst(u.x, u.y, 14, u.t === 'P' ? 'cyan' : u.t === 'S' ? 'green' : 'fire', 200, 0.5, 0.8);
      if (u.t === 'P') { if (P.wl < 5) P.wl++; else score += 1000; }
      else if (u.t === 'S') { if (P.shield < 5) P.shield++; else score += 1000; }
      else { if (P.bombs < 5) P.bombs++; else score += 1000; }
    }
  }
}
