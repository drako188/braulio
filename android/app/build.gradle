plugins {
    id 'com.android.application'
}

android {
    namespace 'com.braulio.novastrike'
    compileSdk 34

    defaultConfig {
        applicationId 'com.braulio.novastrike'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // El juego (HTML5) vive en /www y se empaqueta como assets del APK.
    sourceSets {
        main { assets.srcDirs = ['../../www'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
