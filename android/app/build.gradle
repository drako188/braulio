plugins {
    id 'com.android.application'
}

android {
    namespace 'com.braulio.novastrike'
    compileSdk 34

    defaultConfig {
        applicationId 'com.braulio.novastrike'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Firma de publicación: se toma de variables de entorno (secretos de GitHub).
    signingConfigs {
        release {
            def ks = System.getenv('NS_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('NS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NS_KEY_ALIAS')
                keyPassword System.getenv('NS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('NS_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }

    // El juego (HTML5) vive en /www y se empaqueta como assets del APK.
    sourceSets {
        main { assets.srcDirs = ['../../www'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
    implementation 'com.android.billingclient:billing:7.0.0'
}
