name: Build APK

# Solo se compila a mano: Actions → Build APK → Run workflow
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Versión firmada para Google Play (requiere los secretos de firma)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de prueba
        if: ${{ !inputs.release }}
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: NovaStrike-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Preparar llave de firma
        if: ${{ inputs.release }}
        env:
          KEYSTORE_B64: ${{ secrets.NS_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/novastrike.jks"

      - name: Compilar AAB y APK firmados
        if: ${{ inputs.release }}
        working-directory: android
        env:
          NS_KEYSTORE_PATH: ${{ runner.temp }}/novastrike.jks
          NS_KEYSTORE_PASSWORD: ${{ secrets.NS_KEYSTORE_PASSWORD }}
          NS_KEY_ALIAS: ${{ secrets.NS_KEY_ALIAS }}
          NS_KEY_PASSWORD: ${{ secrets.NS_KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release }}
        with:
          name: NovaStrike-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
